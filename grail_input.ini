; grail-input settings / 설정
; Restart the game after editing. / 고친 뒤 게임을 다시 켜야 적용됩니다.
; Lists use commas: click = A, START   /   목록은 쉼표로 구분합니다.

[general]
; 0 = turn the input mod off (the parsec fix below still works)
; 0 = 입력 모드 끄기 (아래 parsec 커서 수정은 그대로 동작)
enabled = 1
; 0 = no log, 1 = normal, 2 = detailed (grail_input.log next to the game)
; 0 = 로그 없음, 1 = 기본, 2 = 자세히 (게임 폴더의 grail_input.log)
log_level = 1
; 1 = gamepad works even when the game window is not focused
; 1 = 게임 창이 포커스가 아니어도 게임패드 입력 처리
background_input = 0

[gamepad]
enabled = 1
; Buttons: A B X Y LB RB LT RT BACK START LS RS DUP DDOWN DLEFT DRIGHT NONE
; (PlayStation: A=Cross B=Circle X=Square Y=Triangle, LB=L1, RT=R2, BACK=Share/Create, START=Options)
; 버튼 이름: A B X Y LB RB LT RT BACK START LS RS DUP DDOWN DLEFT DRIGHT NONE
click = A                 ; left click, hold to drag / 왼쪽 클릭, 누르고 있으면 드래그
right_click = B           ; right click / 오른쪽 클릭
escape = X, START         ; Esc key (menu, close) / Esc 키 (메뉴, 닫기)
center = BACK             ; cursor to screen centre (tap) / 커서를 화면 가운데로 (짧게 누르기)
wheel_up = LB             ; scroll up / 위로 스크롤
wheel_down = RB           ; scroll down / 아래로 스크롤
nav_up = DUP              ; jump to the nearest button/card above / 위쪽 가장 가까운 버튼·카드로 이동
nav_down = DDOWN
nav_left = DLEFT
nav_right = DRIGHT
slow = NONE               ; hold for precise cursor / 누르는 동안 커서 느리게
fast = NONE               ; hold for fast cursor / 누르는 동안 커서 빠르게
; LT / RT are shortcut slots 1 / 2 (see [shortcuts] below).
; LT / RT는 단축키 1번 / 2번 칸입니다 (아래 [shortcuts] 참고).
; Y is left to the game itself (hold Y over a card to inspect it).
; Y는 게임 자체 기능(카드 위에서 Y를 누르고 있으면 자세히 보기)에 남겨 둡니다.

cursor_stick = left       ; left / right / none
scroll_stick = right      ; left / right / none
deadzone = 0.22           ; 0.0 - 0.9
cursor_speed = 1.1        ; screen heights per second at full tilt / 끝까지 기울였을 때 초당 화면 높이 배수
slow_multiplier = 0.35
fast_multiplier = 2.0
scroll_rate = 12          ; wheel notches per second at full tilt / 초당 휠 칸 수

[keyboard]
enabled = 1
; Keys: letters, digits, F1-F12, UP DOWN LEFT RIGHT RETURN SPACE TAB ESCAPE BACKSPACE
;       HOME END PAGEUP PAGEDOWN INSERT DELETE SHIFT CTRL ALT LSHIFT RSHIFT LCTRL RCTRL APPS NUMPAD0-9 NONE
; Letters are best avoided: the card encyclopedia search box reads typed letters.
; 글자 키는 피하는 게 좋습니다: 카드 도감 검색창이 입력한 글자를 받습니다.
click = RETURN, SPACE
right_click = RCTRL, APPS
escape = NONE             ; the real Esc key already reaches the game / Esc는 원래대로 게임에 전달됨
center = HOME
wheel_up = PAGEUP
wheel_down = PAGEDOWN
nav_up = UP
nav_down = DOWN
nav_left = LEFT
nav_right = RIGHT
slow = NONE
fast = NONE
; Hold this with the arrow keys to move the cursor freely instead of jumping.
; 이 키를 누른 채 방향키를 누르면 점프 대신 커서가 자유롭게 움직입니다.
free_move_modifier = SHIFT
cursor_speed = 0.7

[navigation]
; 1 = D-pad / arrows jump between the game's buttons and cards
; 0 = D-pad / arrows only nudge the cursor
; 1 = D패드·방향키로 게임의 버튼과 카드 사이를 점프, 0 = 커서를 조금씩 이동만
smart = 1
repeat_delay_ms = 320
repeat_interval_ms = 120
fallback_step = 0.08      ; nudge size when nothing can be jumped to (fraction of screen height)
min_target_size = 6       ; ignore targets smaller than this (pixels)
max_target_area = 0.45    ; ignore targets bigger than this part of the screen
sideways_weight = 2.0     ; higher = prefer targets straight ahead over closer ones to the side
; 1 = skip panels that only hold other targets (hand area, list backgrounds)
; 1 = 다른 대상을 감싸기만 하는 패널(손패 영역, 목록 배경)로는 점프하지 않음
ignore_containers = 1
; Hover tests from these game scripts are never jump targets (scroll areas, text boxes...).
; With log_level = 2 the log lists every target and the script it comes from.
; 이 게임 스크립트의 영역으로는 점프하지 않음 (스크롤 영역, 텍스트 상자 등).
; log_level = 2 로 두면 로그에 대상마다 어느 스크립트에서 왔는지 나옵니다.
ignore_scripts = UI_scroll_bar, UI_scroll_bar_ext, draw_text_box, battle_log_draw, cosmetic_draw

[overlay]
; Drawn on top of the game: a frame around the button the D-pad / arrows selected,
; and the shortcut key next to buttons that have one.
; 게임 화면 위에 그림: D패드·방향키로 고른 버튼 테두리, 단축키가 있는 버튼 옆 키 표시.
enabled = 1
highlight = 1
prompts = 1
scale = 0                 ; size of the key labels, 0 = automatic / 키 표시 크기, 0 = 자동

[shortcuts]
; A shortcut presses a game button you choose (deck, ripped up cards, end turn...).
; 8 slots: slot 1 = F1 / LT, slot 2 = F2 / RT, slots 3-8 = F3-F8.
; Bind in game: put the cursor on the button, then press Ctrl + F1 (slot 1) ... Ctrl + F8,
;   or hold the bind button below and press a pad button. Over empty space it clears the slot.
; Slots are saved to grail_input_shortcuts.ini (keys and pad buttons can be changed there).
; 단축키는 원하는 게임 버튼(덱 보기, 찢어진 카드, 턴 종료 등)을 대신 눌러 줍니다.
; 8칸: 1번 = F1 / LT, 2번 = F2 / RT, 3~8번 = F3~F8.
; 게임 안에서 지정: 버튼에 커서를 올리고 Ctrl + F1(1번 칸) ~ Ctrl + F8,
;   또는 아래 지정 버튼을 누른 채 패드 버튼. 빈 곳에서 하면 그 칸이 비워집니다.
; 지정한 내용은 grail_input_shortcuts.ini 에 저장됩니다 (키·패드 버튼도 거기서 바꿀 수 있음).
bind_modifier = BACK      ; hold this pad button to bind / 누른 채로 지정하는 패드 버튼

[cursor]
; Parsec fix: stops Parsec from capturing the mouse when the game hides the system cursor.
;   off (default) / transparent / arrow
; Parsec 커서 수정: 게임이 OS 커서를 숨길 때 Parsec이 마우스를 가두지 않게 함.
;   off(기본) / transparent(투명 커서) / arrow(기본 화살표)
parsec_fix = off
; How the game is told where the virtual cursor is:
;   auto (default) = only while the gamepad/keyboard is moving the cursor
;   always / never
; 가상 커서 위치를 게임에 알려주는 방식: auto(기본) / always / never
position_override = auto
